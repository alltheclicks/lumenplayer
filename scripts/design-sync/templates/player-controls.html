<div class="relative aspect-video max-w-2xl overflow-hidden rounded-lg border border-border bg-[hsl(var(--surface-0))]">
  <!-- fake video area -->
  <div class="absolute inset-0 flex items-center justify-center text-xs text-muted-foreground">video</div>
  <!-- bottom control bar -->
  <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-background via-background/70 to-transparent p-4 pt-10">
    <!-- progress -->
    <div class="group relative mb-3 h-1.5 w-full cursor-pointer rounded-full bg-muted">
      <div class="absolute inset-y-0 left-0 w-3/4 rounded-full bg-muted-foreground/40"></div>
      <div class="absolute inset-y-0 left-0 w-1/2 rounded-full bg-primary"></div>
      <div class="absolute left-1/2 top-1/2 h-3.5 w-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary ring-2 ring-ring ring-offset-2 ring-offset-background"></div>
    </div>
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button class="inline-flex h-10 w-10 items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">⏯</button>
        <button class="inline-flex h-10 w-10 items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground">⏪</button>
        <button class="inline-flex h-10 w-10 items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground">⏩</button>
        <span class="ml-2 text-xs tabular-nums text-muted-foreground">12:34 / 45:00</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-md bg-[hsl(var(--catchup))] px-2 py-0.5 text-[10px] font-semibold text-[hsl(var(--catchup-foreground))]">CATCH-UP</span>
        <button class="inline-flex h-9 items-center justify-center rounded-md bg-[hsl(var(--live))] px-3 text-xs font-semibold text-[hsl(var(--live-foreground))] transition-colors hover:opacity-90">● UŽIVO</button>
        <button class="inline-flex h-10 w-10 items-center justify-center rounded-md text-sm transition-colors hover:bg-accent hover:text-accent-foreground">🔊</button>
        <button class="inline-flex h-10 w-10 items-center justify-center rounded-md text-sm transition-colors hover:bg-accent hover:text-accent-foreground">⛶</button>
      </div>
    </div>
  </div>
</div>
