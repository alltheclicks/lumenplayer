limit_req_zone $binary_remote_addr zone=lumen_observe:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lumen_sso:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lumen_analytics:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lumen_replay:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name player.exyu.tv;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name player.exyu.tv;

    ssl_certificate /etc/letsencrypt/live/player.exyu.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/player.exyu.tv/privkey.pem;

    # Versioned deploys atomically switch this symlink; the legacy
    # /var/www/player tree stays intact as the first rollback target.
    root /var/www/lumen-current;
    index index.html;
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # V1 media/API traffic is device -> provider CDN. Keep the relay and
    # catch-up resolver unreachable from the public pilot origin.
    location ^~ /xui-api/ {
        return 404;
    }

    location = /observe {
        client_max_body_size 16k;
        limit_req zone=lumen_observe burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # exyu.tv SSO hand-off: the SPA posts the token from /sso#token=<t> here.
    # The token only travels in the URL fragment and this POST body, so the
    # access log never sees it.
    location = /sso/exchange {
        client_max_body_size 4k;
        limit_req zone=lumen_sso burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser telemetry is bound to the HttpOnly analytics session established
    # during SSO. Only the local proxy knows the EXYU destination/shared secret.
    location = /player-analytics/ingest {
        client_max_body_size 256k;
        limit_req zone=lumen_analytics burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /player-analytics/replay {
        client_max_body_size 5m;
        limit_req zone=lumen_replay burst=10 nodelay;
        limit_req_status 429;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /catchup-gateway/ {
        return 404;
    }

    location /assets/ {
        # Hashed Vite assets are safe to retain for a year. `expires` is used
        # instead of a nested add_header so the server security headers remain
        # inherited in this location.
        expires 1y;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        expires -1;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
