    # Live Cloudflare/Flexible player application snippet. This intentionally
    # preserves the existing XUI/catch-up proxy behavior on the managed VPS.
    root /var/www/lumen-current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /xui-api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /observe {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /sso/exchange {
        client_max_body_size 4k;
        limit_req zone=lumen_sso burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /player-analytics/ingest {
        client_max_body_size 256k;
        limit_req zone=lumen_analytics burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /player-analytics/replay {
        client_max_body_size 5m;
        limit_req zone=lumen_replay burst=10 nodelay;
        limit_req_status 429;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8788;
    }

    location /catchup-gateway/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service-worker code must never sit in Cloudflare's four-hour static-JS
    # cache; otherwise an already logged-in user can remain on an old player
    # release after a successful deploy.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        expires -1;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
