name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build web app
        run: pnpm build

  automation-scripts:
    name: automation-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate automation scripts syntax
        run: bash -n scripts/automation/*.sh

  release-gates:
    name: release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate QAF-035 release gates
        run: pnpm release:qaf035:validate

      - name: Test QAF-035 release gate validator
        run: pnpm release:qaf035:test

      - name: Test release guardrail validators
        run: pnpm release:guardrails:test

      - name: Test no-media evidence scanner
        run: pnpm release:no-media-evidence:test

      - name: Validate no-media scan artifact
        run: pnpm release:no-media-scan-artifact:validate

      - name: Validate observability baseline
        run: pnpm release:observability-baseline:validate

      - name: Test disabled catch-up media probe
        run: pnpm catchup:timeshift-hls:test

      - name: Validate proxy no-media runtime guard
        run: pnpm release:proxy-no-media:validate

      - name: Test proxy no-media runtime guard
        run: pnpm release:proxy-no-media:test
