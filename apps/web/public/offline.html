<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Lumen Player</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.2), transparent 55%),
          radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.18), transparent 50%),
          #030712;
        color: #e5e7eb;
      }

      main {
        width: min(560px, calc(100% - 2rem));
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.28);
        box-shadow: 0 20px 60px rgba(2, 6, 23, 0.45);
      }

      h1 {
        margin: 0 0 0.75rem 0;
        font-size: clamp(1.4rem, 2.2vw, 1.9rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #cbd5e1;
      }

      .actions {
        margin-top: 1.5rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      button,
      a {
        border: 0;
        border-radius: 0.65rem;
        padding: 0.65rem 1rem;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        color: #0f172a;
        background: #22c55e;
      }

      a {
        color: #e2e8f0;
        background: rgba(148, 163, 184, 0.2);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Lumen Player could not reach the network. Reconnect and retry, or go back to the app home
        if connectivity is restored.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry</button>
        <a href="/">Open app</a>
      </div>
    </main>
  </body>
</html>
