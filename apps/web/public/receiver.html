<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen Cast Receiver</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        color: #f4f6ff;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        position: relative;
      }

      cast-media-player {
        --theme-hue: 202;
        --logo-image: none;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #bridge-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      #bridge-root video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        #bridge-root video {
          transition: none;
        }
      }

      #bridge-root video[data-active="true"] {
        opacity: 1;
      }

      #status-chip {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 4;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(4, 8, 18, 0.72);
        border: 1px solid rgba(82, 165, 255, 0.35);
        font-size: 12px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
    </style>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <cast-media-player id="default-player"></cast-media-player>

    <div id="bridge-root" aria-hidden="true">
      <video id="bridge-video-a" preload="metadata" playsinline muted></video>
      <video id="bridge-video-b" preload="metadata" playsinline muted></video>
    </div>

    <div id="status-chip">Bridge idle</div>

    <script>
      (function () {
        var BRIDGE_NAMESPACE = 'urn:x-cast:com.lumenplayer.bridge';
        var castFramework = window.cast && window.cast.framework;
        if (!castFramework) {
          return;
        }

        var castContext = castFramework.CastReceiverContext.getInstance();
        var playerManager = castContext.getPlayerManager();
        var statusChip = document.getElementById('status-chip');
        var slotA = document.getElementById('bridge-video-a');
        var slotB = document.getElementById('bridge-video-b');
        var CANPLAY_TIMEOUT_MS = 5000;
        var PERF_REPORT_INTERVAL = 10;
        var commandQueue = Promise.resolve();
        var perfStats = {
          commandCount: 0,
          preloadCount: 0,
          preloadTotalMs: 0,
          swapCount: 0,
          swapTotalMs: 0,
          skippedSwapCount: 0,
        };

        var state = {
          activeSlot: 'a',
          standbySourceUrl: null,
          standbyReady: false,
          activeSourceUrl: null,
          muted: false,
          volumeLevel: 1,
          statusLabel: '',
        };

        var getSlots = function () {
          if (state.activeSlot === 'a') {
            return {
              active: slotA,
              standby: slotB,
            };
          }

          return {
            active: slotB,
            standby: slotA,
          };
        };

        var renderLayers = function () {
          slotA.dataset.active = state.activeSlot === 'a' ? 'true' : 'false';
          slotB.dataset.active = state.activeSlot === 'b' ? 'true' : 'false';

          var slots = getSlots();
          slots.active.muted = state.muted;
          slots.active.volume = state.volumeLevel;
          slots.standby.muted = true;
          slots.standby.volume = state.volumeLevel;
        };

        var setStatus = function (label) {
          if (!statusChip || state.statusLabel === label) {
            return;
          }

          state.statusLabel = label;
          statusChip.textContent = label;
        };

        var reportPerfStats = function () {
          if (perfStats.commandCount === 0 || perfStats.commandCount % PERF_REPORT_INTERVAL !== 0) {
            return;
          }

          var averagePreloadMs = perfStats.preloadCount > 0
            ? Math.round((perfStats.preloadTotalMs / perfStats.preloadCount) * 10) / 10
            : 0;
          var averageSwapMs = perfStats.swapCount > 0
            ? Math.round((perfStats.swapTotalMs / perfStats.swapCount) * 10) / 10
            : 0;

          // Lightweight profile breadcrumbs for older-device debugging.
          console.info('[lumen-cast-perf]', {
            commandCount: perfStats.commandCount,
            preloadCount: perfStats.preloadCount,
            avgPreloadMs: averagePreloadMs,
            swapCount: perfStats.swapCount,
            avgSwapMs: averageSwapMs,
            skippedSwapCount: perfStats.skippedSwapCount,
          });
        };

        var waitForCanPlay = function (videoElement) {
          return new Promise(function (resolve) {
            if (videoElement.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
              resolve();
              return;
            }

            var resolved = false;
            var timeoutId;
            var done = function () {
              if (resolved) {
                return;
              }
              resolved = true;
              window.clearTimeout(timeoutId);
              videoElement.removeEventListener('canplay', done);
              videoElement.removeEventListener('loadedmetadata', done);
              videoElement.removeEventListener('error', done);
              resolve();
            };

            timeoutId = window.setTimeout(done, CANPLAY_TIMEOUT_MS);
            videoElement.addEventListener('canplay', done, { once: true });
            videoElement.addEventListener('loadedmetadata', done, { once: true });
            videoElement.addEventListener('error', done, { once: true });
          });
        };

        var loadIntoSlot = async function (videoElement, payload, options) {
          if (!payload || typeof payload.url !== 'string' || payload.url.length === 0) {
            throw new Error('Missing bridge source URL.');
          }

          if (videoElement.src !== payload.url) {
            videoElement.src = payload.url;
            videoElement.load();
          }

          if (videoElement.readyState < HTMLMediaElement.HAVE_METADATA) {
            await waitForCanPlay(videoElement);
          }

          if (typeof payload.startTimeSeconds === 'number' && Number.isFinite(payload.startTimeSeconds)) {
            var safeStart = Math.max(0, payload.startTimeSeconds);
            if (Math.abs(videoElement.currentTime - safeStart) > 1) {
              videoElement.currentTime = safeStart;
            }
          }

          if (options && options.play === true) {
            try {
              await videoElement.play();
            } catch (_playbackError) {
              // Browser-level autoplay limitations are ignored on Cast devices.
            }
          } else {
            videoElement.pause();
          }
        };

        var preloadStandby = async function (payload) {
          if (!payload || payload.url === state.standbySourceUrl && state.standbyReady) {
            return;
          }

          var startedAt = Date.now();
          var slots = getSlots();
          await loadIntoSlot(slots.standby, payload, { play: false });
          state.standbySourceUrl = payload.url;
          state.standbyReady = true;
          perfStats.preloadCount += 1;
          perfStats.preloadTotalMs += Date.now() - startedAt;
          setStatus('Bridge preloaded');
        };

        var swapToStandby = async function (payload) {
          if (payload && payload.url === state.activeSourceUrl) {
            perfStats.skippedSwapCount += 1;
            await applyPlaybackCommand(payload.play === false ? 'pause' : 'play');
            setStatus('Bridge active');
            return;
          }

          var startedAt = Date.now();
          var slots = getSlots();
          var canSwapPreloaded = state.standbyReady && state.standbySourceUrl === payload.url;

          if (!canSwapPreloaded) {
            await loadIntoSlot(slots.standby, payload, {
              play: payload.play !== false,
            });
            state.standbyReady = true;
            state.standbySourceUrl = payload.url;
          }

          slots.active.pause();
          state.activeSlot = state.activeSlot === 'a' ? 'b' : 'a';
          state.activeSourceUrl = payload.url;
          state.standbyReady = false;
          state.standbySourceUrl = null;
          renderLayers();

          var newActive = getSlots().active;
          if (payload.play !== false) {
            try {
              await newActive.play();
            } catch (_playbackError) {
              // Ignore device playback race; sender retries commands.
            }
          }

          perfStats.swapCount += 1;
          perfStats.swapTotalMs += Date.now() - startedAt;
          setStatus('Bridge active');
        };

        var applyPlaybackCommand = async function (command) {
          var active = getSlots().active;
          if (command === 'play') {
            try {
              await active.play();
            } catch (_playbackError) {
              // Cast devices should allow playback; keep flow resilient.
            }
            return;
          }

          if (command === 'pause') {
            active.pause();
            return;
          }

          if (command === 'stop') {
            active.pause();
            active.removeAttribute('src');
            active.load();
            state.activeSourceUrl = null;
            setStatus('Bridge stopped');
          }
        };

        var applyBridgeMessage = async function (data) {
          if (!data || typeof data !== 'object') {
            return;
          }

          if (data.type === 'preload') {
            await preloadStandby(data);
            return;
          }

          if (data.type === 'swap') {
            await swapToStandby(data);
            return;
          }

          if (data.type === 'seek') {
            var active = getSlots().active;
            if (typeof data.positionSeconds === 'number' && Number.isFinite(data.positionSeconds)) {
              active.currentTime = Math.max(0, data.positionSeconds);
            }
            return;
          }

          if (data.type === 'set-volume') {
            if (typeof data.level === 'number' && Number.isFinite(data.level)) {
              state.volumeLevel = Math.max(0, Math.min(1, data.level));
            }
            if (typeof data.muted === 'boolean') {
              state.muted = data.muted;
            }
            var activeSlots = getSlots();
            activeSlots.active.volume = state.volumeLevel;
            activeSlots.standby.volume = state.volumeLevel;
            activeSlots.active.muted = state.muted;
            activeSlots.standby.muted = true;
            return;
          }

          if (data.type === 'play' || data.type === 'pause' || data.type === 'stop') {
            await applyPlaybackCommand(data.type);
          }
        };

        castContext.addCustomMessageListener(BRIDGE_NAMESPACE, function (event) {
          commandQueue = commandQueue.then(function () {
            perfStats.commandCount += 1;
            return applyBridgeMessage(event.data);
          }).then(function () {
            reportPerfStats();
          }).catch(function () {
            setStatus('Bridge command failed');
          });
        });

        playerManager.setMessageInterceptor(
          castFramework.messages.MessageType.PRELOAD,
          function (requestData) {
            if (requestData && requestData.media && typeof requestData.media.contentId === 'string') {
              commandQueue = commandQueue.then(function () {
                perfStats.commandCount += 1;
                return preloadStandby({
                  type: 'preload',
                  url: requestData.media.contentId,
                  startTimeSeconds:
                    typeof requestData.currentTime === 'number' ? requestData.currentTime : 0,
                });
              }).then(function () {
                reportPerfStats();
              }).catch(function () {
                setStatus('Bridge preload failed');
              });
            }

            return requestData;
          }
        );

        playerManager.addEventListener(castFramework.events.EventType.READY, function () {
          setStatus('Bridge ready');
        });

        renderLayers();
        castContext.start({
          disableIdleTimeout: true,
        });
      })();
    </script>
  </body>
</html>
