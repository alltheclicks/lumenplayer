<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/klaro-player-design-system-0163f186-10a6-4b66-9271-90a3ee964bf7/foundations/tokens.css">
<link rel="stylesheet" href="_ds/klaro-player-design-system-0163f186-10a6-4b66-9271-90a3ee964bf7/foundations/theme-tuning.css">
<link rel="stylesheet" href="assets/klaro-palette.css">
<script src="_ds/klaro-player-design-system-0163f186-10a6-4b66-9271-90a3ee964bf7/_ds_bundle.js"></script>
</helmet>
<div data-row="1" data-active-wrap="{{ ch.activeFlag }}" style="position:relative;display:flex;align-items:center;gap:2px;border-radius:12px;margin:2px 0">
  <sc-if value="{{ ch.active }}" hint-placeholder-val="{{ false }}">
    <span data-row-bg="1" style="position:absolute;inset:0;border-radius:12px;background:hsl(var(--primary)/0.16);box-shadow:inset 0 0 0 1.5px hsl(var(--primary)/0.6);pointer-events:none"></span>
    <span data-row-bar="1" style="position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:hsl(var(--primary))"></span>
  </sc-if>
  <button data-nav="1" data-active-row="{{ ch.activeFlag }}" data-ch-id="{{ ch.id }}" onClick="{{ ch.select }}" style="position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 6px 10px 8px;border:0;background:transparent;color:inherit;text-align:left;border-radius:12px;cursor:pointer;font:inherit">
    <span style="width:22px;flex:none;font-size:12px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums;text-align:right">{{ ch.num }}</span>
    <span style="width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;background:hsl(var(--surface-2));box-shadow:inset 0 0 0 1px hsl(var(--border));font-family:'Roboto',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.02em;color:hsl(var(--foreground)/0.9)">{{ ch.mono }}</span>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <span style="display:flex;align-items:center;gap:8px;min-width:0">
        <span data-row-name="1" style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:500;line-height:1.25">{{ ch.name }}</span>
        <sc-if value="{{ ch.active }}" hint-placeholder-val="{{ false }}">
          <span style="display:inline-flex;align-items:flex-end;gap:2px;height:12px;flex:none">
            <span style="width:3px;height:100%;border-radius:2px;background:hsl(var(--primary));transform-origin:bottom;animation:lpEq 1.1s ease-in-out infinite"></span>
            <span style="width:3px;height:100%;border-radius:2px;background:hsl(var(--primary));transform-origin:bottom;animation:lpEq 1.1s ease-in-out 0.25s infinite"></span>
            <span style="width:3px;height:100%;border-radius:2px;background:hsl(var(--primary));transform-origin:bottom;animation:lpEq 1.1s ease-in-out 0.5s infinite"></span>
          </span>
        </sc-if>
      </span>
      <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:hsl(var(--muted-foreground))">{{ ch.sub }}</span>
      <sc-if value="{{ ch.showProgress }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <span style="position:relative;flex:1;height:3px;border-radius:3px;background:hsl(var(--muted))">
            <span style="position:absolute;left:0;top:0;bottom:0;width:{{ ch.pctS }};border-radius:3px;background:hsl(var(--a2,var(--primary))/0.85)"></span>
          </span>
          <span style="flex:none;font-size:11px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums">{{ ch.left }}</span>
        </span>
      </sc-if>
    </span>
    <sc-if value="{{ ch.catchup }}" hint-placeholder-val="{{ false }}">
      <span title="TV unazad · arhiva 7 dana" aria-label="TV unazad" style="width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid hsl(var(--catchup)/0.4);background:hsl(var(--catchup)/0.15);color:hsl(var(--catchup))">
        <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><use href="#i-rewind"></use></svg>
      </span>
    </sc-if>
  </button>
  <sc-if value="{{ ch.tvFavMark }}" hint-placeholder-val="{{ false }}">
    <span title="U omiljenima · drži OK za uklanjanje" style="width:40px;height:40px;flex:none;display:grid;place-items:center;color:hsl(var(--primary))"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><use href="#i-heartf"></use></svg></span>
  </sc-if>
  <sc-if value="{{ ch.ptrInactive }}" hint-placeholder-val="{{ true }}">
  <button data-nav="1" onClick="{{ ch.toggleFav }}" aria-label="Omiljeni" title="Dodaj u omiljene" data-fav-lift="1" style="position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;cursor:pointer;color:hsl(var(--muted-foreground)/0.7)">
    <sc-if value="{{ ch.fav }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;color:hsl(var(--primary))"><use href="#i-heartf"></use></svg>
    </sc-if>
    <sc-if value="{{ ch.notFav }}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round"><use href="#i-heart"></use></svg>
    </sc-if>
  </button>
  </sc-if>
  <sc-if value="{{ ch.ptrActive }}" hint-placeholder-val="{{ false }}">
  <button data-nav="1" data-fav-btn="1" onClick="{{ ch.toggleFav }}" aria-label="Omiljeni" title="{{ ch.favTitle }}" style="position:relative;height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;margin-right:4px;border:0;border-radius:10px;background:hsl(var(--primary)/0.14);box-shadow:inset 0 0 0 1px hsl(var(--primary)/0.5);cursor:pointer;color:hsl(var(--foreground));font:inherit;font-size:11.5px;font-weight:600" style-hover="background:hsl(var(--primary)/0.24)">
    <sc-if value="{{ ch.fav }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;color:hsl(var(--primary))"><use href="#i-heartf"></use></svg>
    </sc-if>
    <sc-if value="{{ ch.notFav }}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round"><use href="#i-heart"></use></svg>
    </sc-if>
    <sc-if value="{{ ch.beacon }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-4px;border-radius:13px;border:2px solid hsl(var(--primary));pointer-events:none;animation:lpBeacon 1.6s ease-out infinite"></span></sc-if>
  </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:70},&quot;ch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
